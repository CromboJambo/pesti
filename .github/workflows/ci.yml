name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for CI run'
        required: false
        default: 'Manual trigger'
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  clippy:
    name: Clippy (Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
      
      - name: Run Clippy (Strict)
        run: |
          cargo clippy --workspace --all-features -- -D warnings
          cargo clippy --workspace --all-features -- -W clippy::pedantic
          cargo clippy --workspace --all-features -- -W clippy::nursery

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "tests"
      
      - name: Run tests
        run: cargo test --workspace --all-features

  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"
      
      - name: Build release
        run: cargo build --release --workspace

  semver-check:
    name: Semver Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks
      
      - name: Check semver compatibility
        run: cargo semver-checks check-release
        continue-on-error: true  # Allow breaking changes in 0.x