[package]
name = "pesti-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core PESTI crates (workspace inheritance)
pesti-gguf.workspace = true
pesti-plug-in.workspace = true
pesti-safetensors.workspace = true

# Tokenizers - using tokenizers crate with ByteLevel BPE config
tokenizers = { workspace = true, features = ["fancy-regex"] }
tiktoken-rs.workspace = true

# Pure Rust Qwen2 BPE tokenizer (optional)
qwen2-bpe = { path = "../crates/qwen2-bpe", optional = true }

# Tracing and error handling
tracing.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

# Mistral.rs for Qwen2 tokenizer support
mistralrs-core = "0.8.1"
mistralrs-vision = "0.8.1"
serde_json.workspace = true

# CPU parallelism
rayon.workspace = true

# Half precision floats
half.workspace = true

# Random number generation
rand.workspace = true

# NDArray support
ndarray.workspace = true

# CUDA support (optional)
cudarc = { workspace = true, optional = true }
nvml-wrapper.workspace = true

# Async runtime and HTTP
tokio.workspace = true
reqwest.workspace = true
uuid.workspace = true
rusqlite.workspace = true

# Regex support
regex.workspace = true

# Safetensors runtime
safetensors.workspace = true

# Temp files for tokenizer config
tempfile.workspace = true

# HuggingFace Hub
hf-hub.workspace = true

# ML inference (pure-Rust path)
candle-core = { workspace = true, package = "candle-core" }
candle-nn.workspace = true

# Llama C++ FFI
llama-cpp-2.workspace = true
llama-cpp-sys-2.workspace = true

# Encoding support
encoding_rs.workspace = true

[features]
default = []
cuda = ["cudarc"]
rust-tokenizer = ["qwen2-bpe"]
