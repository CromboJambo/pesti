[package]
name = "pesti-mcp-server"
version = "0.1.2"
edition = "2024"
description = "MCP server exposing pesti's structural tokenizer tools"
license = "AGPL-3.0-or-later"

[[bin]]
name = "pesti-mcp"
path = "src/main.rs"

[dependencies]
pesti-structural-tokenizer = { path = "../crates/pesti-structural-tokenizer", version = "0.1.2" }
rmcp = { version = "3.5", features = ["server"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
