[package]
name = "pesti-structural-tokenizer"
version = "0.1.2"
edition = "2024"
description = "Rust structural tokenizer for LLM code understanding. encodes syntactic boundaries as token boundaries"
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/CromboJambo/pesti"
homepage = "https://github.com/CromboJambo/pesti/tree/main/crates/pesti-structural-tokenizer"
documentation = "https://docs.rs/pesti-structural-tokenizer"
keywords = ["tokenizer", "rust", "llm", "code-analysis", "structural"]
categories = ["parsing", "development-tools", "text-processing"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tiktoken-rs.workspace = true
syn = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[example]]
name = "demo"
path = "examples/demo.rs"
